# Mantiene despierto el servicio gratis de Render y dispara el vigilante (recordatorios y alertas) cada 5 minutos.
name: ping
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 --retry 3 https://casa-club-tigres.onrender.com/api/health
