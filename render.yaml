# Render (plan gratis). Base de datos: Neon (Postgres gratis). Variables marcadas sync:false se piden al crear el servicio.
services:
  - type: web
    name: casa-club-tigres
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL        # cadena de conexión de Neon (…?sslmode=require)
        sync: false
      - key: SECRET              # firma de sesiones; no cambiarla después (cierra todas las sesiones)
        generateValue: true
      - key: TZ_CLUB
        value: America/Monterrey
